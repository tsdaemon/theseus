---
- name: Start Stats stack
  block:
    - name: Create Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_nas_user }}"
        group: "{{ ansible_nas_group }}"
        mode: "0770"
        recurse: yes
      with_items:
        - "{{ stats_directory }}"
        - "{{ stats_prometheus_data_directory }}"
        - "{{ stats_prometheus_config_directory }}"
        - "{{ stats_prometheus_rules_directory }}"
        - "{{ stats_telegraf_config_directory }}"
        - "{{ stats_grafana_data_directory }}"
        - "{{ stats_grafana_config_directory }}"
        - "{{ stats_grafana_config_directory }}/dashboards"
        - "{{ stats_grafana_config_directory }}/provisioning/datasources"
        - "{{ stats_grafana_config_directory }}/provisioning/dashboards"

    - name: Template Grafana data source
      ansible.builtin.template:
        src: datasources/ansible-nas.yml
        dest: "{{ stats_grafana_config_directory }}/provisioning/datasources/ansible-nas.yml"

    - name: Copy Grafana dashboards configuration
      ansible.builtin.copy:
        src: dashboards/ansible-nas.yml
        dest: "{{ stats_grafana_config_directory }}/provisioning/dashboards/ansible-nas.yml"

    - name: Copy Grafana Ansible-NAS dashboard
      ansible.builtin.copy:
        src: dashboards/ansible-nas-overview.json
        dest: "{{ stats_grafana_config_directory }}/dashboards/ansible-nas-overview.json"

    - name: Copy Grafana WireGuard dashboard
      ansible.builtin.copy:
        src: dashboards/wireguard.json
        dest: "{{ stats_grafana_config_directory }}/dashboards/wireguard.json"
      when: wireguard_enabled

    - name: Copy Grafana Network dashboard
      ansible.builtin.copy:
        src: dashboards/network.json
        dest: "{{ stats_grafana_config_directory }}/dashboards/network.json"
      when: stats_ping_enabled

    - name: Detect provider hop (ISP first hop past the router)
      ansible.builtin.command: "ping -n -c 6 -W 1 -t 2 {{ stats_ping_provider_probe_host }}"
      register: stats_ping_provider_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: stats_ping_enabled and not stats_ping_provider_targets

    - name: Set network ping targets
      ansible.builtin.set_fact:
        stats_ping_all_targets: >-
          {{ stats_ping_targets | combine({'provider': stats_ping_provider_targets}) if stats_ping_provider_targets
             else stats_ping_targets | combine({'provider': [stats_ping_provider_detected]}) if stats_ping_provider_detected
             else stats_ping_targets }}
      vars:
        stats_ping_provider_detected: >-
          {{ (stats_ping_provider_probe.stdout | default('')
              | regex_findall('From ([0-9.]+) .*Time to live exceeded') + [''])[0] }}
      when: stats_ping_enabled

    - name: Warn when provider hop was not detected
      ansible.builtin.debug:
        msg: "Provider hop not detected; set stats_ping_provider_targets to probe it."
      when: stats_ping_enabled and 'provider' not in stats_ping_all_targets

    - name: Template Prometheus network recording rules
      ansible.builtin.template:
        src: rules/network.yml.j2
        dest: "{{ stats_prometheus_rules_directory }}/network.yml"
      when: stats_ping_enabled

    - name: Template Prometheus config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ stats_prometheus_config_directory }}/prometheus.yml"
      register: prometheus_config

    - name: Template telegraf.conf
      ansible.builtin.template:
        src: telegraf.conf.j2
        dest: "{{ stats_telegraf_config_directory }}/telegraf.conf"
      register: telegraf_config

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yaml
        dest: "{{ stats_directory }}/docker-compose.yml"

    - name: Start Stats stack
      community.docker.docker_compose_v2:
        project_src: "{{ stats_directory }}"

    # telegraf.conf is bind-mounted, so compose does not notice when it changes.
    - name: Restart Telegraf after config change
      community.docker.docker_compose_v2:
        project_src: "{{ stats_directory }}"
        services:
          - telegraf
        state: restarted
      when: telegraf_config.changed
  when: stats_enabled

- name: Stop Stats stack
  community.docker.docker_compose_v2:
    project_src: "{{ stats_directory }}"
    state: stopped
  when: not stats_enabled
