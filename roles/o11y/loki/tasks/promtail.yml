---

- name: Start Promtail
  block:
    - name: Import variables
      include_vars: defaults/promtail.yml

    - name: Create Promtail Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ loki_promtail_data_directory }}/config"
        - "{{ loki_promtail_data_directory }}/data"

    - name: Template Promtail config
      ansible.builtin.template:
        src: promtail_config.yml
        dest: "{{ loki_promtail_data_directory }}/config/config.yml"

    - name: Create Promtail Docker Container
      community.docker.docker_container:
        name: "{{ loki_promtail_container_name }}"
        image: "{{ loki_promtail_image_name }}:{{ loki_promtail_image_version }}"
        pull: true
        command: "-config.file=/etc/promtail/config.yml"
        volumes:
          - "{{ loki_promtail_data_directory }}/config/config.yml:/etc/promtail/config.yml"
          - "{{ loki_promtail_data_directory }}/data/:/data"
          - "/var/run/docker.sock:/var/run/docker.sock"
        restart_policy: unless-stopped
        memory: "{{ loki_promtail_memory }}"
        networks:
          - name: "{{ o11y_network_name }}"
  when: loki_enabled is true

- name: Stop promtail
  block:
    - name: Stop promtail
      community.docker.docker_container:
        name: "{{ loki_promtail_container_name }}"
        state: absent
  when: loki_enabled is false
