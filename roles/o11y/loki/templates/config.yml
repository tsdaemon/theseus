---
server:
  http_listen_port: {{ loki_http_port }}
  log_level: {{ loki_log_level }}

limits_config:
  allow_structured_metadata: false
  retention_period: {{ loki_log_retention }}

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  # Single-node Loki: an in-memory ring avoids memberlist entirely.
  # An empty `memberlist:` block zeroes the ring KV defaults and crash-loops Loki.
  ring:
    kvstore:
      store: inmemory

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
