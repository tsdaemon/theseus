---
- name: Download hddfancontrol deb package
  ansible.builtin.get_url:
    url: "https://github.com/desbma/hddfancontrol/releases/download/2.0.3/hddfancontrol_2.0.3-1_amd64.deb"
    dest: "/tmp/hddfancontrol_2.0.3-1_amd64.deb"
    mode: "0644"

- name: Install hddfancontrol deb package
  ansible.builtin.apt:
    deb: "/tmp/hddfancontrol_2.0.3-1_amd64.deb"
    state: present
    install_recommends: false

- name: Clean up downloaded deb package
  ansible.builtin.file:
    path: "/tmp/hddfancontrol_2.0.3-1_amd64.deb"
    state: absent

- name: Ensure nct6775 hwmon module loads at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nct6775.conf
    content: "nct6775\n"
    owner: root
    group: root
    mode: "0644"

- name: Ensure nct6775 is loaded now
  community.general.modprobe:
    name: nct6775
    state: present

- name: Create hddfancontrol systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/hddfancontrol.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Resolve hwmon path by chip name before hddfancontrol starts
  ansible.builtin.template:
    src: hddfancontrol-hwmon.conf.j2
    dest: /etc/systemd/system/hddfancontrol.service.d/hwmon.conf
    owner: root
    group: root
    mode: "0644"
  register: hddfancontrol_dropin

- name: Reload systemd when the drop-in changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: hddfancontrol_dropin is changed

- name: Configure hddfancontrol daemon arguments
  ansible.builtin.template:
    src: hddfancontrol.j2
    dest: /etc/conf.d/hddfancontrol
    owner: root
    group: root
    mode: "0644"
  register: hddfancontrol_conf

- name: Restart hddfancontrol when its configuration changes
  ansible.builtin.systemd:
    name: hddfancontrol
    state: restarted
  when: hddfancontrol_conf is changed or hddfancontrol_dropin is changed

- name: Enable and start hddfancontrol
  ansible.builtin.systemd:
    name: hddfancontrol
    enabled: true
    state: started
