---
- name: Create Docker home directory
  ansible.builtin.file:
    path: "{{ docker_home }}"
    mode: 0755
    state: directory

- name: Add user account to Docker group
  ansible.builtin.user:
    name: "{{ ansible_nas_user }}"
    groups: docker
    append: yes

- name: Generate Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}"
  register: docker_config

- name: Restart Docker # noqa no-handler
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_config.changed

- name: Schedule Docker prune
  ansible.builtin.cron:
    name: docker-prune
    weekday: "0"
    minute: "0"
    hour: "4"
    job: >-
      docker image prune -f > /dev/null
      && docker builder prune -f --filter until={{ docker_prune_until }} > /dev/null
    state: "{{ 'present' if docker_prune_enabled else 'absent' }}"
