[entryPoints]
{% if ansible_nas_external_access_enabled | default(true) %}
  [entryPoints.web]
    address = ":{{ traefik_port_http_external }}"

  [entryPoints.web.http.redirections.entryPoint]
    to = "websecure"

  [entryPoints.websecure]
    address = ":{{ traefik_port_https }}"

      [entryPoints.websecure.http.tls]
        certResolver = "letsencrypt"

        [[entryPoints.websecure.http.tls.domains]]
          main = "{{ ansible_nas_domain }}"
          sans = [
            "*.{{ ansible_nas_domain }}"
          ]

{% endif %}
  [entryPoints.web_local]
    address = ":{{ traefik_port_http_local }}"

  [entryPoints.traefik]
    address = ":{{ traefik_port_ui }}"

[providers]
  providersThrottleDuration = "2s"
  [providers.docker]
    exposedbydefault = false

[api]
  insecure = true
  dashboard = true

[log]
  level = "{{ traefik_log_level }}"

[ping]
  terminatingStatusCode = 0

[certificatesResolvers]
  [certificatesResolvers.letsencrypt]
    [certificatesResolvers.letsencrypt.acme]
      email = "{{ ansible_nas_email }}"
      storage = "/letsencrypt/acme.json"
      caserver = "{{ traefik_acme_server }}"

      [certificatesResolvers.letsencrypt.acme.dnsChallenge]
        provider = "{{ traefik_dns_provider }}"

[metrics]
  [metrics.prometheus]

{% if crowdsec_enabled %}
[experimental.plugins.crowdsec-bouncer-traefik-plugin]
  moduleName = "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
  version = "v1.4.4"
{% endif %}

[accessLog]

[providers.file]
  directory = "/etc/traefik/dynamic"
  watch     = true
