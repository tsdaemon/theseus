---
pihole_enabled: false
pihole_available_externally: false

# directories
pihole_directory: "{{ docker_home }}/pihole"
pihole_config_directory: "{{ docker_home }}/pihole/config"
pihole_dnsmasq_directory: "{{ docker_home }}/pihole/dnsmasq.d"

# network
pihole_hostname: "pihole"
pihole_web_port: "8089"
pihole_dns_port: "53"

# docker
pihole_container_name: "pihole"
pihole_image_name: "pihole/pihole"
pihole_image_version: "latest"

# specs
pihole_memory: "512m"

# Pi-hole specific settings
pihole_webpassword: "admin"  # Change this to your desired admin password
pihole_dns1: "8.8.8.8"  # Primary DNS server
pihole_dns2: "8.8.4.4"  # Secondary DNS server

# dnsmasq lines (FTLCONF_misc_dnsmasq_lines).
pihole_dnsmasq_lines:
  - "address=/{{ ansible_nas_hostname }}/{{ ansible_nas_ip }}"
  - "address=/.{{ ansible_nas_hostname }}/{{ ansible_nas_ip }}"

# LAN-only names under the public domain (routers on the web_secure entrypoint): one hostname per service.
# Each gets address=/name/ip (A record) plus local=/name/ (never forwarded). address= alone still forwards AAAA/HTTPS,
# which leaks a public wildcard's (e.g. Cloudflare) IPv6 and h3/ECH hints.
pihole_local_hostnames: []

# Groups with extra blocklists applied only to their clients (managed via the Pi-hole v6 API).
# Clients also stay in Default. Lists/groups/clients not listed here are left untouched.
# - name: lg-tv
#   clients: ["192.168.0.106"]
#   adlists: ["https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt"]
pihole_groups: []
