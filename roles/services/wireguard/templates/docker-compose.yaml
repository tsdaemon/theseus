---
services:
  wgeasy:
    image: "{{ wireguard_image_name }}:{{ wireguard_image_version }}"
    container_name: "{{ wireguard_container_name }}"
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - "{{ wireguard_config_directory }}:/etc/wireguard"
      - /lib/modules:/lib/modules:ro
    ports:
      - "{{ wireguard_port }}:51820/udp"
      - "{{ wireguard_ui_port }}:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    environment:
      INSECURE: "true"
    labels:
      traefik.enable: "{{ wireguard_available_externally | string }}"
      traefik.http.routers.wireguard.rule: "Host(`{{ wireguard_hostname }}.{{ ansible_nas_domain }}`)"
      traefik.http.routers.wireguard.tls.certresolver: "letsencrypt"
      traefik.http.routers.wireguard.tls.domains[0].main: "{{ ansible_nas_domain }}"
      traefik.http.routers.wireguard.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
      traefik.http.services.wireguard.loadbalancer.server.port: "51821"
      homepage.group: Networking
      homepage.name: WireGuard
      homepage.icon: wireguard
      homepage.href: "http://{{ ansible_nas_ip }}:{{ wireguard_ui_port }}"
      homepage.description: VPN server for secure remote access

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
