mqtt:
  enabled: false

tls:
  enabled: false

audio:
  enabled: true

ffmpeg:
  retry_interval: 30 # pace ffmpeg restarts when the camera is unreachable (default 10s)
{% if frigate_ffmpeg_hwaccel_args %}
  hwaccel_args: "{{ frigate_ffmpeg_hwaccel_args }}"
{% endif %}

go2rtc:
  streams:
    balcony:
      - ffmpeg:rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{{ frigate_balcony_camera_ip }}:554/stream1#video=copy#audio=aac # <- stream which supports video & aac audio.
    balcony_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{{ frigate_balcony_camera_ip }}:554/stream2 # 640x360 sub-stream for detect only

snapshots:
  enabled: true
  timestamp: true

detectors:
  onnx:
    type: onnx

semantic_search:
  enabled: true
  model: jinav1
  model_size: small

model:
  model_type: yolo-generic
  width: {{ frigate_model_img_size }}
  height: {{ frigate_model_img_size }}
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/{{ frigate_model_file }}
  labelmap_path: /labelmap/coco-80.txt

cameras:
  balcony:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/balcony # <--- the name here must match the name of the camera in restream
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/balcony_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
    live:
      streams:
        balcony: balcony
    audio:
      enabled: true
      listen:
        - scream
        - glass
        - smash
        - breaking
        - yell
    zones: {}
    review:
      alerts: {}
    motion: {}
record:
  enabled: true
  continuous:
    days: 30
  motion:
    days: 30
version: 0.18-0
detect:
  enabled: true
