---
name: "lidarr"

services:
  lidarr:
    container_name: "{{ lidarr_container_name }}"
{% if lidarr_build_from_source %}
    image: "{{ lidarr_build_image_name }}"
    build:
      context: "{{ lidarr_source_directory }}"
      dockerfile: "{{ lidarr_build_directory }}/Dockerfile"
{% else %}
    image: "{{ lidarr_image_name }}:{{ lidarr_image_version }}"
    pull_policy: always
{% endif %}
    volumes:
      - "{{ lidarr_config_directory }}:/config:rw"
      - "{{ lidarr_downloads_directory }}:/downloads:rw"
    ports:
      - "{{ lidarr_port }}:8686"
    environment:
      TZ: "{{ ansible_nas_timezone }}"
      PUID: "{{ lidarr_user_id }}"
      PGID: "{{ lidarr_group_id }}"
    restart: unless-stopped
    mem_limit: "{{ lidarr_memory }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.lidarr.rule: "Host(`{{ lidarr_hostname }}.{{ ansible_nas_local_domain }}`)"
      traefik.http.routers.lidarr.entrypoints: "web_local"
      traefik.http.services.lidarr.loadbalancer.server.port: "8686"
      homepage.group: Arr
      homepage.name: Lidarr
      homepage.icon: lidarr
      homepage.href: "http://{{ ansible_nas_ip }}:{{ lidarr_port }}"
      homepage.description: Music collection manager
{% if lidarr_api_key %}
      homepage.widget.type: lidarr
      homepage.widget.url: "http://{{ ansible_nas_ip }}:{{ lidarr_port }}"
      homepage.widget.key: "{{ lidarr_api_key }}"
{% endif %}
