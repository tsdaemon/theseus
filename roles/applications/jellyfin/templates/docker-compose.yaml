---
name: "jellyfin"

services:
  jellyfin:
    container_name: "{{ jellyfin_container_name }}"
    image: "{{ jellyfin_image_name }}:{{ jellyfin_image_version }}"
    volumes:
      - "{{ jellyfin_config_directory }}:/config:rw"
      - "{{ jellyfin_cache_directory }}:/cache:rw"
      - "{{ jellyfin_movies_directory }}:/movies:rw"
      - "{{ jellyfin_tv_directory }}:/tv:rw"
      - "{{ jellyfin_music_directory }}:/music:rw"
    network_mode: "host"
{% if jellyfin_gpu_enabled %}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
{% endif %}
    environment:
      TZ: "{{ ansible_nas_timezone }}"
      PUID: "{{ jellyfin_user_id }}"
      PGID: "{{ jellyfin_group_id }}"
{% if jellyfin_gpu_enabled %}
      NVIDIA_DRIVER_CAPABILITIES: all
{% endif %}
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`{{ jellyfin_hostname }}.{{ ansible_nas_local_domain }}`)"
      traefik.http.routers.jellyfin.entrypoints: "web_local"
      traefik.http.services.jellyfin.loadbalancer.server.port: "{{ jellyfin_port }}"
      homepage.group: "Applications"
      homepage.name: Jellyfin
      homepage.icon: jellyfin
      homepage.href: "http://{{ ansible_nas_ip }}:{{ jellyfin_port }}"
      homepage.description: Media server
