---
prowlarr_enabled: false
prowlarr_available_externally: false

# directories
prowlarr_directory: "{{ docker_home }}/prowlarr"
prowlarr_config_directory: "{{ prowlarr_directory }}/config"

# uid / gid
prowlarr_user_id: "{{ ansible_nas_user_id }}"
prowlarr_group_id: "{{ ansible_nas_group_id }}"

# network
prowlarr_hostname: "prowlarr"
prowlarr_port: "9696"

# docker
prowlarr_container_name: "prowlarr"
prowlarr_image_name: "linuxserver/prowlarr"
prowlarr_image_version: "latest"

# specs
prowlarr_memory: "512m"

# prowlarr_api_key is set in secrets.yaml (from Prowlarr Settings > General >
# Security > API Key, after first run) to enable the homepage widget.
