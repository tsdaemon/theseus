---
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:{{ immich_version }}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - "{{ immich_data_directory }}:/usr/src/app/upload"
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - "{{ immich_directory }}/.env"
    ports:
      - '{{ immich_port }}:2283'
    depends_on:
      - redis
      - database
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: "Host(`{{ immich_hostname }}.{{ ansible_nas_local_domain }}`)"
      traefik.http.routers.immich.entrypoints: "web_local"
      traefik.http.services.immich.loadbalancer.server.port: "2283"
{% if immich_available_externally %}
      traefik.http.routers.immich-external.rule: "Host(`{{ immich_hostname }}.{{ ansible_nas_domain }}`)"
      traefik.http.routers.immich-external.tls.certresolver: "letsencrypt"
      traefik.http.routers.immich-external.tls.domains[0].main: "{{ ansible_nas_domain }}"
      traefik.http.routers.immich-external.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
      traefik.http.routers.immich-external.entrypoints: "web,websecure"
      traefik.http.routers.immich-external.service: "immich"
{% endif %}
      homepage.group: "Applications"
      homepage.name: "Immich"
      homepage.icon: "immich.png"
      homepage.href: "http://{{ ansible_nas_ip }}:{{ immich_port }}"
      homepage.description: "Photo and video management"
      homepage.widget.type: "immich"
      homepage.widget.url: "http://{{ ansible_nas_ip }}:{{ immich_port }}"
      homepage.widget.key: "{{ immich_api_key }}"
      homepage.widget.version: "2"
    user: "{{ ansible_nas_user_id }}:{{ ansible_nas_group_id }}"
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - "{{ immich_directory }}/.env"
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fec42f399876eb6faf9e008570597741c87ff7662a54185593e74b09ce83d177
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_USER: "{{ immich_db_username }}"
      POSTGRES_DB: "{{ immich_db_database_name }}"
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - "{{ immich_database_directory }}:/var/lib/postgresql/data"
    user: "{{ ansible_nas_user_id }}:{{ ansible_nas_group_id }}"
    restart: always

volumes:
  model-cache:
