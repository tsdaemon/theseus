#
# WARNING: To install Immich, follow our guide: https://immich.app/docs/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:{{ immich_version }}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - "{{ immich_data_directory }}:/usr/src/app/upload"
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - "{{ immich_directory }}/.env"
    ports:
      - '{{ immich_port }}:2283'
    depends_on:
      - redis
      - database
    restart: always
    labels:
      - "traefik.enable={{ immich_available_externally | string }}"
      - "traefik.http.routers.immich.rule=Host(`{{ immich_host }}.{{ ansible_nas_domain }}`)"
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      - "traefik.http.routers.immich.tls.domains[0].main={{ ansible_nas_domain }}"
      - "traefik.http.routers.immich.tls.domains[0].sans=*.{{ ansible_nas_domain }}"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "homepage.group=Media"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=https://{{ immich_host }}.{{ ansible_nas_domain }}"
      - "homepage.description=Photo and video management"
    user: "{{ ansible_nas_user_id }}:{{ ansible_nas_group_id }}"
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:{{ immich_version }}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - "{{ immich_directory }}/.env"
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fec42f399876eb6faf9e008570597741c87ff7662a54185593e74b09ce83d177
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_USER: "{{ immich_db_username }}"
      POSTGRES_DB: "{{ immich_db_database_name }}"
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - "{{ immich_database_directory }}:/var/lib/postgresql/data"
    user: "{{ ansible_nas_user_id }}:{{ ansible_nas_group_id }}"
    restart: always

volumes:
  model-cache:
