---
slskd_enabled: false

# directories
slskd_directory: "{{ docker_home }}/slskd"
slskd_config_directory: "{{ slskd_directory }}/app"
slskd_soularr_config_directory: "{{ slskd_directory }}/soularr"
# Downloads must live under lidarr_downloads_directory so Lidarr can import
# them from the same filesystem (see slskd_lidarr_downloads_directory).
slskd_downloads_directory: "{{ media_root }}/soulseek/downloads"
slskd_incomplete_directory: "{{ media_root }}/soulseek/incomplete"
# Shared read-only back to the network; Soulseek users often ban leechers.
slskd_shared_directory: "{{ music_root }}"
# slskd_downloads_directory as seen from inside the Lidarr container.
slskd_lidarr_downloads_directory: "{{ slskd_downloads_directory | regex_replace('^' ~ lidarr_downloads_directory, '/downloads') }}"

# uid / gid
slskd_user_id: "{{ ansible_nas_user_id }}"
slskd_group_id: "{{ ansible_nas_group_id }}"

# network
slskd_hostname: "slskd"
slskd_port_http: "5030"
# Soulseek peer port; forwarded (TCP) on the router so firewalled peers can
# connect to us.
slskd_port_listen: "50300"
# Distributed network: stay in it so our share still answers searches, but
# don't accept children; relaying the network's searches to up to 25 children
# opened thousands of peer connections (router NAT/conntrack load).
slskd_distributed_children_disabled: true
# Incoming search throttling (slskd defaults 10 / 500 / 500): every search we
# answer is a peer connection, and waves of distributed searches flood the
# router's NAT table. Fewer in flight, drop the backlog, smaller responses.
slskd_search_incoming_concurrency: 5
slskd_search_incoming_circuit_breaker: 100
slskd_search_incoming_response_file_limit: 100

# docker
slskd_container_name: "slskd"
slskd_image_name: "slskd/slskd"
slskd_image_version: "latest"

# specs
slskd_memory: "1g"

# slskd_soulseek_username, slskd_soulseek_password (Soulseek network account,
# registered on first login), slskd_web_password and slskd_api_key
# (16+ chars) are set in secrets.yaml.
slskd_web_username: "slskd"

# soularr: feeds Lidarr "Wanted > Missing" into slskd and triggers imports.
slskd_soularr_enabled: true
slskd_soularr_container_name: "soularr"
slskd_soularr_image_name: "mrusse08/soularr"
slskd_soularr_image_version: "latest"
slskd_soularr_memory: "512m"
# Albums searched per run and seconds between runs. albums_per_run is what
# keeps the 4k+ backlog from flooding the network; keep it low.
slskd_soularr_albums_per_run: 5
slskd_soularr_interval: 300
slskd_soularr_allowed_filetypes: "flac 24/192,flac 16/44.1,flac,mp3 320"
