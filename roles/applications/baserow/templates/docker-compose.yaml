name: baserow

services:
  baserow:
    container_name: "{{ baserow_container_name }}"
    image: "{{ baserow_image_name }}:{{ baserow_image_version }}"
    pull_policy: always
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "{{ baserow_port }}:80"
    volumes:
      - "{{ baserow_data_directory }}:/baserow/data"
    environment:
      BASEROW_PUBLIC_URL: "{% if baserow_available_externally %}https://{{ baserow_hostname }}.{{ ansible_nas_domain }}{% else %}http://{{ ansible_nas_ip }}:{{ baserow_port }}{% endif %}"
      DATABASE_URL: "postgresql://{{ baserow_db_user }}@postgres:5432/{{ baserow_db_name }}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
{% if baserow_available_externally %}
      BASEROW_ENABLE_SECURE_PROXY_SSL_HEADER: "true"
{% endif %}
    labels:
      traefik.enable: "true"
      traefik.http.routers.baserow.rule: "Host(`{{ baserow_hostname }}.{{ ansible_nas_local_domain }}`)"
      traefik.http.routers.baserow.entrypoints: "web_local"
      traefik.http.services.baserow.loadbalancer.server.port: "80"
{% if baserow_available_externally %}
      traefik.http.routers.baserow-external.rule: "Host(`{{ baserow_hostname }}.{{ ansible_nas_domain }}`)"
      traefik.http.routers.baserow-external.tls.certresolver: "letsencrypt"
      traefik.http.routers.baserow-external.tls.domains[0].main: "{{ ansible_nas_domain }}"
      traefik.http.routers.baserow-external.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
      traefik.http.routers.baserow-external.entrypoints: "web,websecure"
      traefik.http.routers.baserow-external.service: "baserow"
{% endif %}
      homepage.group: "Applications"
      homepage.name: "Baserow"
      homepage.icon: mdi-table-large
      homepage.href: "http://{{ ansible_nas_ip }}:{{ baserow_port }}"
      homepage.description: "Open-source no-code database"

  postgres:
    container_name: "{{ baserow_container_name }}_postgres"
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: "{{ baserow_db_user }}"
      POSTGRES_DB: "{{ baserow_db_name }}"
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "{{ baserow_database_directory }}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ baserow_db_user }} -d {{ baserow_db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: "{{ baserow_container_name }}_redis"
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
