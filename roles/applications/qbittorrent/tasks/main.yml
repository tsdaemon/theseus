---
- name: Start qbittorrent
  block:
    - name: Create qbittorrent Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_nas_user }}"
        group: "{{ ansible_nas_group }}"
        mode: "770"
      with_items:
        - "{{ qbittorrent_directory }}"
        - "{{ qbittorrent_config_directory }}"
        - "{{ qbittorrent_download_directory }}"
        - "{{ qbittorrent_download_directory_active }}"

    - name: Create docker-compose.yaml
      ansible.builtin.template:
        src: docker-compose.yaml
        dest: "{{ qbittorrent_directory }}/docker-compose.yaml"
        mode: '0440'

    - name: Start qbittorrent
      community.docker.docker_compose_v2:
        project_src: "{{ qbittorrent_directory }}"
  when: qbittorrent_enabled

- name: Stop qbittorrent
  community.docker.docker_compose_v2:
    project_src: "{{ qbittorrent_directory }}"
    state: stopped
  when: not qbittorrent_enabled
