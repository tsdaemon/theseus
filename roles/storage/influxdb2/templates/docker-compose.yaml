---
name: influxdb2

services:
  influxdb2:
    container_name: "{{ influxdb2_container_name }}"
    image: "{{ influxdb2_image }}"
    pull_policy: always
    ports:
      - "{{ influxdb2_tcp_port }}:8086"
    volumes:
      - "{{ influxdb2_directory }}/config:/etc/influxdb2:rw"
      - "{{ influxdb2_directory }}/wal:/var/lib/influxdb2/engine/wal:rw"
      - "{{ influxdb2_data_directory }}:/var/lib/influxdb2:rw"
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.influxdb2.rule: "Host(`{{ influxdb2_hostname }}.{{ ansible_nas_local_domain }}`)"
      traefik.http.routers.influxdb2.entrypoints: "web_local"
      traefik.http.services.influxdb2.loadbalancer.server.port: "8086"
      homepage.group: Monitoring
      homepage.name: InfluxDB
      homepage.icon: influxdb
      homepage.href: "http://{{ ansible_nas_ip }}:{{ influxdb2_tcp_port }}"
      homepage.description: Time-series database
