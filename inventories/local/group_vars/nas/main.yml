netdata_enabled: false
netdata_claim_token: "HjAD-r4SQXKz-FzaU2OxuCzZ8kA_uWpTRpgfO-sB-0GmR8z96_AZbuE-deXORBC9LkMegAVHZcZJp8mFBnWEa8kzzTY0Ggxa_k_0-gEWazPiCNaVEIhcFDBdwxr3e5qh92Cmv2U"
