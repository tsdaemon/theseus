---
ansible_become_password: "{{ theseus_sudo_password }}"

keep_packages_updated: true

ansible_nas_hostname: theseus
ansible_nas_timezone: Europe/Kyiv
ansible_nas_email: tsdaemon@gmail.com
ansible_nas_domain: tsd.lol
ansible_nas_local_domain: theseus
ansible_nas_user: theseus
ansible_nas_user_id: "1001"
ansible_nas_group: users
ansible_nas_group_id: "100"

# Enable public entrypoints; individual services remain private by default.
ansible_nas_external_access_enabled: true

# mail
ansible_nas_from_address: "theseus@mail.t6n.app"
ansible_nas_from_name: "Theseus NAS"
ansible_nas_smtp_hostname: "smtp.eu.mailgun.org"
ansible_nas_smtp_username: "theseus@mail.t6n.app"

ansible_nas_data_root: "/mnt/data"

docker_home: /appdata
docker_network_name: "main"
docker_group_id: 987

# Samba
samba_shares_root: "{{ ansible_nas_data_root }}/data/media"
samba_server_string: theseus
samba_map_to_guest: "Bad user"
samba_guest_account: "{{ ansible_nas_user }}"
samba_manage_directories: false
samba_server_max_protocol: SMB3
samba_server_min_protocol: SMB2

media_root: "{{ samba_shares_root }}"
movies_root: "{{ media_root }}/movies"
tv_root: "{{ media_root }}/tv"
books_root: "{{ media_root }}/books"
comics_root: "{{ media_root }}/comics"
music_root: "{{ media_root }}/music"
photo_root: "{{ media_root }}/photo"
archive_root: "{{ ansible_nas_data_root }}/archive"
cameras_root: "{{ media_root }}/cameras"

# Shares you want published over Samba.
samba_shares:
  - name: movies
    comment: "Movies"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ movies_root }}"

  - name: tv
    comment: "TV Episodes"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ tv_root }}"

  - name: books
    comment: "Books"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ books_root }}"

  - name: comics
    comment: "Comics"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ comics_root }}"

  - name: music
    comment: "Music"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ music_root }}"

  - name: photos
    comment: "Photos"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ photo_root }}"

  - name: archive
    comment: "Archive"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ archive_root }}"

  - name: cameras
    comment: "Cameras"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ cameras_root }}"

# Applications

## n8n
n8n_enabled: false

## frigate
frigate_enabled: true

## calibre
calibre_enabled: true

## immich
immich_enabled: true
immich_available_externally: false
immich_hostname: im

## qbittorrent
qbittorrent_enabled: true
qbittorrent_available_externally: false
qbittorrent_hostname: qb
qbittorrent_download_directory: "{{ ansible_nas_data_root }}/data"
qbittorrent_download_directory_active: "{{ media_root }}/incomplete"

## plex
plex_enabled: true
plex_available_externally: false
plex_hostname: plex
plex_config_directory: "{{ ansible_nas_data_root }}/data/plex"

## lidarr
lidarr_enabled: true
lidarr_available_externally: false
lidarr_hostname: lidarr

## flaresolverr
flaresolverr_enabled: true
flaresolverr_available_externally: false
flaresolverr_hostname: flaresolverr

## prowlarr
prowlarr_enabled: true
prowlarr_available_externally: false
prowlarr_hostname: prowlarr

## navidrome
navidrome_enabled: true
navidrome_available_externally: false
navidrome_hostname: navidrome

## stash
stash_enabled: true
stash_hostname: stash
stash_data_content_directory: "{{ ansible_nas_data_root }}/private/stash/content"
stash_blobs_directory: "{{ ansible_nas_data_root }}/private/stash/blobs"
stash_generated_directory: "{{ ansible_nas_data_root }}/private/stash/generated"
stash_qbittorrent_hostname: qb-stash

## gramps
gramps_enabled: true
gramps_available_externally: false
gramps_tree_name: "Anatolii Stehnii Family Tree"
gramps_hostname: "gr"

## bambuddy
bambuddy_enabled: true
bambuddy_port: "18000"

## obico
obico_enabled: false
obico_port: "3334"

# baserow
baserow_enabled: true

# Storage

## influxdb2
influxdb2_enabled: true
influxdb2_data_directory: "{{ ansible_nas_data_root }}/data/influxdb2"

## mariadb
mariadb_enabled: true
mariadb_data_directory: "{{ ansible_nas_data_root }}/data/mariadb"
mariadb_databases:
  - name: homeassistant
mariadb_users:
  - name: homeassistant
    database: homeassistant
    host: "%"
    privileges: "ALL"

# Services

## traefik
traefik_enabled: true
traefik_dns_provider: porkbun
traefik_basic_auth_enabled: true

## cloudflared
cloudflared_enabled: true

## crowdsec
crowdsec_enabled: false
crowdsec_data_directory: "{{ ansible_nas_data_root }}/data/crowdsec"

## homepage
homepage_enabled: true
homepage_available_externally: false
homepage_bookmarks_yaml:
homepage_widgets_yaml:
  - greeting:
      text_size: xl
      text: Theseus
  - resources:
      cpu: true
      memory: true
      cputemp: true
      uptime: true
      units: metric # only used by cpu temp
      refresh: 60000 # optional, in ms
  - openmeteo:
      label: Lviv # optional
      latitude: 49.839683
      longitude: 24.029717
      timezone: Europe/Kyiv # optional
      units: metric # or imperial
      cache: 5 # Time in minutes to cache API responses, to stay within limits
      format: # optional, Intl.NumberFormat options
        maximumFractionDigits: 1
homepage_services_yaml:
  - External:
      - Router:
          icon: asus-router
          href: "http://192.168.0.1/"
          description: Asus Router
      - Home Assistant:
          icon: home-assistant.png
          href: "http://192.168.0.100/"
          description: Home Assistant

homepage_settings_yaml:
  title: "Theseus Homepage"
  language: "en-GB"
  showStats: true
  layout:
    - Applications:
        style: row
        columns: 5
    - 3D printing:
    - Monitoring:
    - Networking:
    - Services:
    - External:
    - Arr:
        style: row
        columns: 5
  maxGroupColumns: 8
  useEqualHeights: true
  statusStyle: "dot"
  quicklaunch:
    searchDescriptions: true
    hideInternetSearch: true
    showSearchSuggestions: true
    hideVisitURL: true
    provider: google

## duplicati
duplicati_enabled: true
duplicati_available_externally: false
duplicati_hostname: dpl
duplicati_data_permissions: rw

## cloudcmd
cloudcmd_enabled: true
cloudcmd_port: "7373"

## pihole
pihole_enabled: true
pihole_dns1: "8.8.8.8"
pihole_dns2: "1.1.1.1"

## wireguard
wireguard_enabled: true

## portainer
portainer_enabled: true

## mariadb


# o11y

## loki
loki_enabled: true
loki_data_directory: "{{ ansible_nas_data_root }}/data/loki"
loki_minio_data_directory: "{{ ansible_nas_data_root }}/data/loki/minio"
loki_promtail_data_directory: "{{ ansible_nas_data_root }}/data/loki/promtail"

## stats
stats_enabled: true
stats_grafana_available_externally: false
stats_internet_speed_test_enabled: true
stats_prometheus_data_directory: "{{ ansible_nas_data_root }}/data/stats/prometheus"
stats_grafana_data_directory: "{{ ansible_nas_data_root }}/data/stats/grafana"
stats_telegraf_influxdb_port: "8186"
stats_smartctl_docker_image_name: "tsdaemon/prometheus-smartctl"

## watchtower
watchtower_enabled: true
