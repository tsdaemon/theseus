version: '3'

env:
  ANSIBLE_VERBOSITY: 1

tasks:
  default:
    desc: Show list of available commands
    cmds:
      - task --list

  update:
    desc: Upgrade dependencies
    cmds:
      - ansible-galaxy install -r requirements.yml

  theseus:
    desc: Run Thesesus playbook
    cmds:
      - ansible-playbook -i inventories/theseus/inventory playbooks/theseus.yml {{if .CLI_ARGS}}--tags "{{.CLI_ARGS}}"{{end}}
